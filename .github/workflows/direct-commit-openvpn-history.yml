name: Historical OpenVPN direct-commit released scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/direct-commit-openvpn-history.yml'
      - 'tools/direct_commit_historical_identity.py'
      - 'tools/direct_commit_admission.py'
      - 'tools/direct_commit_corpus_manifest.py'
      - 'tools/event_corpus_manifest.py'
      - 'tools/full_tree_candidates.py'
      - 'tools/default_branch_event.py'
      - 'tools/incoming_event.py'
      - 'tools/r3_linux_handoff.py'
      - 'tools/direct_commit_corpus_linux.py'
      - 'tools/current_corpus_linux.py'
      - 'tools/sarif_accept.py'
      - 'tools/test_direct_commit_historical_identity.py'
      - 'tools/test_direct_commit_admission.py'
      - 'tools/test_direct_commit_corpus_manifest.py'
      - 'docs/direct-commit-corpus-linux.md'
      - 'docs/openvpn-historical-source-v0.1.json'
      - 'docs/direct-commit-openvpn-admission-v1.json'
      - 'docs/direct-commit-openvpn-alert-v1.json'
      - 'docs/r3-openvpn-source-oracle.json'
      - 'docs/r3-release-lock.json'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test historical identity and direct-commit contracts
        run: python3 -B -m unittest tools.test_direct_commit_historical_identity tools.test_direct_commit_admission tools.test_direct_commit_corpus_manifest tools.test_direct_commit_corpus_linux -v

  released-historical-scan:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare clean pinned historical LuCI source and control
        shell: bash
        run: |
          set -euo pipefail
          source_checkout="$RUNNER_TEMP/historical-luci-source"
          control_checkout="$RUNNER_TEMP/historical-luci-control"
          for checkout in "$source_checkout" "$control_checkout"; do
            git init "$checkout"
            git -C "$checkout" remote add origin https://github.com/openwrt/luci.git
          done
          git -C "$source_checkout" fetch --depth=2 origin 5306e007656fe9a77aee2d2a94072d003b0b5a7d
          git -C "$source_checkout" checkout --detach 5306e007656fe9a77aee2d2a94072d003b0b5a7d
          git -C "$control_checkout" fetch --depth=1 origin e4ff45ecbc6ad212951815c8c99b2749fbd7de6b
          git -C "$control_checkout" checkout --detach e4ff45ecbc6ad212951815c8c99b2749fbd7de6b
      - name: Resolve historical source identities and build source-first oracle
        shell: bash
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/historical-openvpn-inputs"
          mkdir -m 700 "$inputs"
          source_checkout="$RUNNER_TEMP/historical-luci-source"
          control_checkout="$RUNNER_TEMP/historical-luci-control"
          python3 -B -m tools.direct_commit_historical_identity --source-checkout "$source_checkout" --control-checkout "$control_checkout" --receipt "$inputs/identity.json"
          python3 -B -m tools.direct_commit_admission --identity "$inputs/identity.json" --source-checkout "$source_checkout" --control-checkout "$control_checkout" --output "$inputs/admission.json"
          python3 -B tools/full_tree_candidates.py docs/openvpn-historical-source-v0.1.json luci "$source_checkout" 7f6ba9d46028635f0d5aa2e15fcab9ffd163a688 5306e007656fe9a77aee2d2a94072d003b0b5a7d "$inputs/inventory.json"
          python3 -B -m tools.direct_commit_corpus_manifest --identity "$inputs/identity.json" --admission-check "$inputs/admission.json" --inventory "$inputs/inventory.json" --source-checkout "$source_checkout" --control-checkout "$control_checkout" --output "$inputs/manifest.json"
      - name: Verify immutable release and R3 same-job handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_root="$RUNNER_TEMP/r3-ucode-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B -m tools.r3_linux_handoff docs/r3-release-lock.json "$run_root" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Run released historical 112-path corpus and require known alert
        shell: bash
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/historical-openvpn-inputs"
          run_root="$RUNNER_TEMP/r3-ucode-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B -m tools.direct_commit_corpus_linux docs/r3-release-lock.json "$inputs/manifest.json" "$inputs/identity.json" "$inputs/admission.json" "$inputs/inventory.json" "$RUNNER_TEMP/historical-luci-source" "$RUNNER_TEMP/historical-luci-control" "$run_root" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain inputs and released scan outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: historical-openvpn-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/historical-openvpn-inputs/*.json
            ${{ runner.temp }}/r3-ucode-${{ github.run_id }}-${{ github.run_attempt }}/preflight.json
            ${{ runner.temp }}/r3-ucode-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            ${{ runner.temp }}/r3-ucode-${{ github.run_id }}-${{ github.run_attempt }}/commands.json
            ${{ runner.temp }}/r3-ucode-${{ github.run_id }}-${{ github.run_attempt }}/commands/**
            ${{ runner.temp }}/r3-ucode-${{ github.run_id }}-${{ github.run_attempt }}/out/**
            ${{ runner.temp }}/r3-ucode-${{ github.run_id }}-${{ github.run_attempt }}/direct-commit-corpus/validated-direct-manifest.json
            ${{ runner.temp }}/r3-ucode-${{ github.run_id }}-${{ github.run_attempt }}/direct-commit-corpus/preflight.json
            ${{ runner.temp }}/r3-ucode-${{ github.run_id }}-${{ github.run_attempt }}/direct-commit-corpus/receipt.json
            ${{ runner.temp }}/r3-ucode-${{ github.run_id }}-${{ github.run_attempt }}/direct-commit-corpus/failure.json
            ${{ runner.temp }}/r3-ucode-${{ github.run_id }}-${{ github.run_attempt }}/direct-commit-corpus/commands.json
            ${{ runner.temp }}/r3-ucode-${{ github.run_id }}-${{ github.run_attempt }}/direct-commit-corpus/commands/**
            ${{ runner.temp }}/r3-ucode-${{ github.run_id }}-${{ github.run_attempt }}/direct-commit-corpus/out/**
