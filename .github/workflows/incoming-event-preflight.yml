name: Incoming source event identity preflight

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: Upstream repository to check out
        type: choice
        required: true
        options: [openwrt, luci]
      pr_number:
        description: Claimed upstream PR number (metadata only)
        type: number
        required: true
      source_sha:
        description: Full 40-character upstream commit SHA
        type: string
        required: true
      control_sha:
        description: Full 40-character clean control commit SHA
        type: string
        required: true

permissions:
  contents: read

jobs:
  resolve-pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select canonical upstream URL
        id: upstream
        env:
          UPSTREAM: ${{ inputs.upstream }}
        run: |
          case "$UPSTREAM" in
            openwrt) url=https://github.com/openwrt/openwrt.git ;;
            luci) url=https://github.com/openwrt/luci.git ;;
            *) echo 'unsupported upstream' >&2; exit 2 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openwrt/${{ inputs.upstream }}
          ref: ${{ inputs.source_sha }}
          path: upstream-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openwrt/${{ inputs.upstream }}
          ref: ${{ inputs.control_sha }}
          path: upstream-control
          persist-credentials: false
      - name: Resolve source and control commit/tree identities
        env:
          UPSTREAM: ${{ inputs.upstream }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_SHA: ${{ inputs.control_sha }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json, os
          from pathlib import Path
          event = {
              "schema": "incoming-event-v1",
              "repository": os.environ["UPSTREAM"],
              "event_type": "manual_sha_drill",
              "pr_number": int(os.environ["PR_NUMBER"]),
              "event_time": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "source_sha": os.environ["SOURCE_SHA"],
              "control_sha": os.environ["CONTROL_SHA"],
          }
          Path("incoming-event.json").write_text(json.dumps(event, indent=2) + "\n")
          PY
          python3 -B tools/incoming_event.py incoming-event.json upstream-source upstream-control incoming-event-receipt.json
      - name: Retain identity receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: incoming-event-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: incoming-event*.json
