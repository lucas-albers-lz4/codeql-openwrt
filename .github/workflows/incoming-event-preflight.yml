name: Incoming source event identity preflight

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: Upstream repository containing the PR base
        type: choice
        required: true
        options: [openwrt, luci]
      pr_number:
        description: Open upstream PR number
        type: number
        required: true
      source_sha:
        description: Full expected PR head commit SHA
        type: string
        required: true
      control_sha:
        description: Full clean control commit SHA from canonical upstream
        type: string
        required: true
  pull_request:
    paths:
      - '.github/workflows/incoming-event-preflight.yml'
      - 'tools/incoming_event.py'
      - 'tools/full_tree_candidates.py'
      - 'tools/test_full_tree_candidates.py'
      - 'tools/event_corpus_manifest.py'
      - 'tools/test_event_corpus_manifest.py'
      - 'tools/event_corpus_linux.py'
      - 'tools/event_control_scan.py'
      - 'tools/issuer_consumer_prerequisite.py'
      - 'tools/issuer_workflow_graph.py'
      - 'tools/issuer_artifact_freeze.py'
      - 'policy/tests/test_issuer_consumer_prerequisite.py'
      - 'policy/tests/test_issuer_control_graph.py'
      - 'policy/tests/test_issuer_workflow_graph.py'
      - 'policy/tests/test_issuer_artifact_freeze.py'
      - 'tools/test_event_control_scan.py'
      - 'tools/current_corpus_linux.py'
      - 'tools/sarif_accept.py'
      - 'policy/tests/test_incoming_event.py'
      - 'policy/tests/test_event_corpus_linux.py'
      - 'policy/tests/test_sarif_accept.py'
      - 'docs/current-corpus-source-v0.6.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test incoming event and full-tree candidate contracts
        run: |
          python3 -B -m unittest policy.tests.test_incoming_event -v
          python3 -B tools/test_full_tree_candidates.py -v
          python3 -B -m unittest tools.test_event_corpus_manifest tools.test_event_control_scan -v
          python3 -B -m unittest policy.tests.test_issuer_consumer_prerequisite policy.tests.test_issuer_control_graph policy.tests.test_issuer_workflow_graph policy.tests.test_issuer_artifact_freeze -v
          python3 -B -m unittest policy.tests.test_event_corpus_linux policy.tests.test_current_corpus_linux policy.tests.test_sarif_accept policy.tests.test_r3_linux_handoff -v
  resolve-pins:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch exact GitHub pull API response
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ inputs.upstream }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          case "$UPSTREAM" in
            openwrt|luci) ;;
            *) echo 'unsupported upstream' >&2; exit 2 ;;
          esac
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/openwrt/$UPSTREAM/pulls/$PR_NUMBER" > pull-api-response.json
          source_sha=$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' pull-api-response.json)
          base_sha=$(jq -er '.base.sha | select(test("^[0-9a-f]{40}$"))' pull-api-response.json)
          api_number=$(jq -er '.number' pull-api-response.json)
          [[ "$api_number" == "$PR_NUMBER" ]]
          [[ "$source_sha" == "$SOURCE_SHA" ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openwrt/${{ inputs.upstream }}
          ref: refs/pull/${{ inputs.pr_number }}/head
          path: upstream-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openwrt/${{ inputs.upstream }}
          ref: ${{ inputs.control_sha }}
          path: upstream-control
          persist-credentials: false
      - name: Resolve API-bound PR source and canonical control identities
        env:
          UPSTREAM: ${{ inputs.upstream }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_SHA: ${{ steps.pull.outputs.source_sha }}
          BASE_SHA: ${{ steps.pull.outputs.base_sha }}
          CONTROL_SHA: ${{ inputs.control_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json, os
          from pathlib import Path
          event = {
              "schema": "incoming-event-v1",
              "repository": os.environ["UPSTREAM"],
              "event_type": "manual_sha_drill",
              "pr_number": int(os.environ["PR_NUMBER"]),
              "event_time": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "source_sha": os.environ["SOURCE_SHA"],
              "base_sha": os.environ["BASE_SHA"],
              "control_sha": os.environ["CONTROL_SHA"],
          }
          Path("incoming-event.json").write_text(json.dumps(event, indent=2) + "\n")
          PY
          python3 -B tools/incoming_event.py incoming-event.json pull-api-response.json upstream-source upstream-control incoming-event-receipt.json
      - name: Fetch exact PR base and compare bounded v0.4 source policy
        env:
          BASE_SHA: ${{ steps.pull.outputs.base_sha }}
          SOURCE_SHA: ${{ steps.pull.outputs.source_sha }}
          UPSTREAM: ${{ inputs.upstream }}
        run: |
          set -euo pipefail
          git -C upstream-source fetch --no-tags --depth=1 origin "$BASE_SHA"
          [[ "$(git -C upstream-source rev-parse --verify "$BASE_SHA^{commit}")" == "$BASE_SHA" ]]
          python3 -B tools/source_policy_drift.py docs/current-corpus-source-v0.4.json "$UPSTREAM" upstream-source "$SOURCE_SHA" "$BASE_SHA" source-policy-drift.json
      - name: Inventory full-tree Ucode candidates against reviewed v0.6 policy
        env:
          BASE_SHA: ${{ steps.pull.outputs.base_sha }}
          SOURCE_SHA: ${{ steps.pull.outputs.source_sha }}
          UPSTREAM: ${{ inputs.upstream }}
        run: |
          set -euo pipefail
          python3 -B tools/full_tree_candidates.py docs/current-corpus-source-v0.6.json "$UPSTREAM" upstream-source "$BASE_SHA" "$SOURCE_SHA" full-tree-candidates.json
      - name: Prepare source-first event corpus oracle
        env:
          UPSTREAM: ${{ inputs.upstream }}
        run: |
          set -euo pipefail
          policy_sha=$(jq -er --arg repo "$UPSTREAM" '.pins[$repo]' docs/current-corpus-source-v0.6.json)
          git -C upstream-source fetch --no-tags --depth=1 origin "$policy_sha"
          python3 -B -m tools.event_corpus_manifest docs/current-corpus-source-v0.6.json incoming-event-receipt.json full-tree-candidates.json upstream-source event-corpus-manifest.json
      - name: Name this attempt's preflight artifact
        id: artifact-name
        if: always()
        run: echo "name=incoming-event-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Retain exact API response, identity receipt and candidate reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          if-no-files-found: warn
          path: |
            pull-api-response.json
            incoming-event*.json
            source-policy-drift.json
            full-tree-candidates.json
            event-corpus-manifest.json

  released-event-scan:
    needs: [contract, resolve-pins]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Determine immutable release-lock readiness
        id: release
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from tools.r3_linux_handoff import pinned
          release = json.loads(Path('docs/r3-release-lock.json').read_text())['release']
          fields = [release[key] for key in ('tag', 'commit', 'asset_url',
                    'asset_sha256', 'manifest_sha256', 'verifier_sha256',
                    'extractor_sha256', 'library_lock_sha256', 'query_lock_sha256',
                    'suite_sha256', 'codeql_binary_sha256')]
          fields += [release['packs'][key]['version'] for key in ('library', 'queries')]
          if all(value is None for value in fields):
              ready = 'false'
              print('Release lock is unset: only the incoming identity and source-oracle preflight can run.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Released event scan not run: the immutable release lock is unset. The preceding identity and source-oracle artifact is preflight only.\n')
          else:
              pinned(json.loads(Path('docs/r3-release-lock.json').read_text()))
              ready = 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ready={ready}\n')
          PY
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        if: steps.release.outputs.ready == 'true'
        with:
          name: ${{ needs.resolve-pins.outputs.artifact_name }}
          path: ${{ runner.temp }}/event-input-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Re-fetch PR and revalidate inputs from canonical Git objects
        if: steps.release.outputs.ready == 'true'
        shell: bash
        env:
          UPSTREAM: ${{ inputs.upstream }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$UPSTREAM" == openwrt || "$UPSTREAM" == luci ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          input_root="$RUNNER_TEMP/event-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          source_root="$RUNNER_TEMP/event-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          control_root="$RUNNER_TEMP/event-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for root in "$source_root" "$control_root"; do
            git init -q "$root"
            git -C "$root" remote add origin "https://github.com/openwrt/$UPSTREAM.git"
          done
          git -C "$source_root" fetch --no-tags --depth=1 origin "refs/pull/$PR_NUMBER/head"
          git -C "$source_root" checkout -q --detach FETCH_HEAD
          [[ "$(git -C "$source_root" rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git -C "$control_root" fetch --no-tags --depth=1 origin "$CONTROL_SHA"
          git -C "$control_root" checkout -q --detach "$CONTROL_SHA"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/openwrt/$UPSTREAM/pulls/$PR_NUMBER" > "$input_root/scan-pull-api-response.json"
          python3 -B tools/incoming_event.py "$input_root/incoming-event.json" "$input_root/scan-pull-api-response.json" "$source_root" "$control_root" "$input_root/replayed-receipt.json"
          cmp "$input_root/incoming-event-receipt.json" "$input_root/replayed-receipt.json"
          base_sha=$(jq -er '.base.commit' "$input_root/incoming-event-receipt.json")
          git -C "$source_root" fetch --no-tags --depth=1 origin "$base_sha"
          policy_sha=$(jq -er --arg repo "$UPSTREAM" '.pins[$repo]' docs/current-corpus-source-v0.6.json)
          git -C "$source_root" fetch --no-tags --depth=1 origin "$policy_sha"
          git -C "$control_root" fetch --no-tags --depth=1 origin "$policy_sha"
          python3 -B tools/full_tree_candidates.py docs/current-corpus-source-v0.6.json "$UPSTREAM" "$source_root" "$base_sha" "$SOURCE_SHA" "$input_root/replayed-inventory.json"
          cmp "$input_root/full-tree-candidates.json" "$input_root/replayed-inventory.json"
          python3 -B -m tools.event_corpus_manifest docs/current-corpus-source-v0.6.json "$input_root/incoming-event-receipt.json" "$input_root/full-tree-candidates.json" "$source_root" "$input_root/replayed-manifest.json"
          cmp "$input_root/event-corpus-manifest.json" "$input_root/replayed-manifest.json"
      - name: Prepare control oracle before either corpus scan
        id: control-oracle
        if: steps.release.outputs.ready == 'true'
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/event-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          control_root="$RUNNER_TEMP/event-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B -c 'import sys; from pathlib import Path; from tools.event_control_scan import prepare_with_report; prepare_with_report(*map(Path, sys.argv[1:]))' "$input_root/incoming-event-receipt.json" "$control_root" "$input_root/control-oracle"
      - name: Verify released producer in same job
        id: r3
        if: steps.release.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_root="$RUNNER_TEMP/r3-event-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B tools/r3_linux_handoff.py docs/r3-release-lock.json "$run_root" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Run released producer and same-job event consumer
        id: event-scan
        if: steps.r3.outcome == 'success'
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/event-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          source_root="$RUNNER_TEMP/event-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          run_root="$RUNNER_TEMP/r3-event-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B -m tools.event_corpus_linux docs/r3-release-lock.json "$input_root/event-corpus-manifest.json" "$input_root/incoming-event-receipt.json" "$input_root/full-tree-candidates.json" "$source_root" "$run_root" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Run independent released clean-control scan
        id: control-scan
        if: always() && !cancelled() && steps.r3.outcome == 'success' && steps.control-oracle.outcome == 'success'
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/event-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          control_root="$RUNNER_TEMP/event-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          run_root="$RUNNER_TEMP/r3-event-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B -m tools.event_control_scan docs/r3-release-lock.json "$input_root/incoming-event-receipt.json" "$control_root" "$input_root/control-oracle" "$run_root" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Check event and control consumer graph (non-issuing)
        id: graph
        if: always() && !cancelled() && steps.release.outputs.ready == 'true'
        env:
          EVENT_OUTCOME: ${{ steps.event-scan.outcome }}
          CONTROL_OUTCOME: ${{ steps.control-scan.outcome }}
        run: python3 -B -m tools.issuer_workflow_graph
      - name: Freeze same-job artifact inventory and recheck sources (non-issuing)
        if: always() && !cancelled() && steps.release.outputs.ready == 'true' && steps.graph.outcome == 'success'
        run: python3 -B -m tools.issuer_artifact_freeze
      - name: Summarize scan outcome and markup coverage gap
        if: always() && steps.release.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / f"r3-event-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}" / 'event-corpus'
          receipt = root / 'receipt.json'
          lines = ['## Released incoming Ucode scan', '']
          if receipt.is_file():
              data = json.loads(receipt.read_text())
              lines += [f"Status: **{data['status']}**", f"Selected: {data['selected_count']}",
                        f"Markup model inconclusive: {data['route_counts']['markup_inconclusive_count']}",
                        f"Results: {json.loads((root / 'out/triage.json').read_text())['result_count']}", '']
              results = json.loads((root / 'out/triage.json').read_text())['results_for_triage']
              if results:
                  lines += ['First 20 result tuples; the artifact retains all:', '']
                  lines += ['    ' + json.dumps(row, sort_keys=True) for row in results[:20]]
          else:
              lines += ['Scan did not produce an accepted event receipt. Inspect the retained R3 and event failure artifacts.']
          control = root.parent / 'control-corpus'
          assertion = control / 'control-assertion.json'
          control_failure = root.parent.parent / f"event-input-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}" / 'control-oracle/control-failure.json'
          if not control_failure.is_file():
              control_failure = root.parent.parent / f"event-input-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}" / 'control-oracle/failure.json'
          if assertion.is_file():
              control_data = json.loads(assertion.read_text())
              lines += ['', f"Clean control: **{control_data['status']}**; results: {control_data['result_count']}"]
          elif control_failure.is_file():
              control_data = json.loads(control_failure.read_text())
              lines += ['', f"Clean control incomplete at **{control_data['stage']}**; inspect retained failure artifact."]
          elif (control / 'out/triage.json').is_file():
              control_data = json.loads((control / 'out/triage.json').read_text())
              lines += ['', f"Control triage is provisional; status: **{control_data['status']}**; results: {control_data['result_count']}. No clean assertion completed."]
          else:
              lines += ['', 'Clean control scan did not complete. Inspect retained control failure artifacts.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY
      - name: Retain released event scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: released-event-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/issuer-freeze-${{ github.run_id }}-${{ github.run_attempt }}/inventory.json
            ${{ runner.temp }}/issuer-freeze-${{ github.run_id }}-${{ github.run_attempt }}/snapshot/**
            ${{ runner.temp }}/event-input-${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            ${{ runner.temp }}/event-input-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/preflight.json
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/commands.json
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/commands/**
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/out/**
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/event-corpus/preflight.json
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/event-corpus/receipt.json
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/event-corpus/failure.json
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/event-corpus/commands.json
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/event-corpus/commands/**
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/event-corpus/out/**
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/control-corpus/preflight.json
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/control-corpus/receipt.json
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/control-corpus/failure.json
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/control-corpus/control-assertion.json
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/control-corpus/commands.json
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/control-corpus/commands/**
            ${{ runner.temp }}/r3-event-${{ github.run_id }}-${{ github.run_attempt }}/control-corpus/out/**
