name: Manual pinned luci-base IPK byte experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/installed-byte-manual.yml'
      - 'tools/installed-byte/**'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check comparator and shell contract
        run: |
          python3 -B -m unittest discover -s tools/installed-byte -p 'test_*.py' -v
          bash -n tools/installed-byte/run.sh
  experiment:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install OpenWrt host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget time
      - name: Build and compare pinned bytes
        run: tools/installed-byte/run.sh "$RUNNER_TEMP/luci-ipk-byte"
      - name: Retain logs and small receipt, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luci-ipk-byte-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/luci-ipk-byte/output/
          if-no-files-found: warn
          retention-days: 14
