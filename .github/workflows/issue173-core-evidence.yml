name: LuCI core package evidence
on:
  pull_request:
    paths:
      - '.github/workflows/issue173-core-evidence.yml'
      - 'evidence/issue173-core-packages-20261126/**'
permissions:
  contents: read
jobs:
  portable-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check retained evidence and negative controls
        run: |
          python3 -B evidence/issue173-core-packages-20261126/verify.py
          python3 -B -m unittest discover -s tools/luci-base-inventory -p 'test_*.py' -v
          python3 -B -m unittest discover -s evidence/issue173-core-packages-20261126 -p 'test_*.py' -v
          python3 -B -O -m unittest discover -s evidence/issue173-core-packages-20261126 -p 'test_*.py' -v
          tar --format=ustar --no-xattrs --no-acls --no-selinux -C evidence -cf "$RUNNER_TEMP/issue173-core.tar" issue173-core-packages-20261126
          mkdir "$RUNNER_TEMP/issue173-core-unpacked"
          tar -xf "$RUNNER_TEMP/issue173-core.tar" -C "$RUNNER_TEMP/issue173-core-unpacked"
          cd /
          python3 -B "$RUNNER_TEMP/issue173-core-unpacked/issue173-core-packages-20261126/verify.py"
          python3 -B -m unittest discover -s "$RUNNER_TEMP/issue173-core-unpacked/issue173-core-packages-20261126" -p 'test_*.py' -v
