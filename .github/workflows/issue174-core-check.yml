name: Core LuCI source-first checker contract
on:
  pull_request:
    paths:
      - '.github/workflows/issue174-core-check.yml'
      - 'tools/issue174-core/**'
      - 'evidence/issue174-localtime-ipk-20261126/**'
      - 'tools/luci-base-inventory/archive.py'
      - 'tools/luci-base-inventory/compare.py'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check observation and preflight controls
        run: |
          python3 -B evidence/issue174-localtime-ipk-20261126/verify.py
          python3 -B -m unittest discover -s evidence/issue174-localtime-ipk-20261126 -p 'test_*.py' -v
          python3 -B -m unittest discover -s tools/issue174-core -p 'test_*.py' -v
          python3 -O -B -m unittest discover -s tools/issue174-core -p 'test_*.py' -v
          python3 -B -m unittest discover -s tools/luci-base-inventory -p 'test_*.py' -v
          tar --format=ustar --no-xattrs --no-acls --no-selinux -C evidence -cf "$RUNNER_TEMP/issue174-evidence.tar" issue174-localtime-ipk-20261126
          mkdir "$RUNNER_TEMP/issue174-unpacked"
          tar -xf "$RUNNER_TEMP/issue174-evidence.tar" -C "$RUNNER_TEMP/issue174-unpacked"
          python3 -B "$RUNNER_TEMP/issue174-unpacked/issue174-localtime-ipk-20261126/verify.py"
          python3 -B -m unittest discover -s "$RUNNER_TEMP/issue174-unpacked/issue174-localtime-ipk-20261126" -p 'test_*.py' -v
