name: issue175 adblock checker
on:
  pull_request:
    paths:
      - 'tools/issue175-adblock/**'
      - 'evidence/issue175-adblock-ipk-20261126/**'
      - 'evidence/issue175-app-review-20261126/**'
      - 'evidence/issue172-luci-source-inventory-20261125/**'
      - 'tools/luci-base-inventory/**'
      - '.github/workflows/issue175-adblock-check.yml'
  push:
    paths:
      - 'tools/issue175-adblock/**'
      - 'evidence/issue175-adblock-ipk-20261126/**'
      - 'evidence/issue175-app-review-20261126/**'
      - 'evidence/issue172-luci-source-inventory-20261125/**'
      - 'tools/luci-base-inventory/**'
      - '.github/workflows/issue175-adblock-check.yml'
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tools/issue175-adblock/tests
      - run: python3 -B -O -m unittest discover -s tools/issue175-adblock/tests
      - run: python3 -B evidence/issue175-app-review-20261126/verify.py
      - run: python3 -B -m unittest discover -s evidence/issue175-app-review-20261126 -p 'test_*.py'
      - run: python3 -O -B -m unittest discover -s evidence/issue175-app-review-20261126 -p 'test_*.py'
      - name: Verify portable evidence through GNU tar
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/issue175"
          COPYFILE_DISABLE=1 tar --format=ustar --no-xattrs --no-acls --no-selinux -cf "$RUNNER_TEMP/issue175/evidence.tar" -C evidence issue175-adblock-ipk-20261126
          tar -xf "$RUNNER_TEMP/issue175/evidence.tar" -C "$RUNNER_TEMP/issue175"
          cd /
          python3 -B "$RUNNER_TEMP/issue175/issue175-adblock-ipk-20261126/verify.py"
          python3 -B -m unittest discover -s "$RUNNER_TEMP/issue175/issue175-adblock-ipk-20261126" -p 'test_*.py'
          python3 -B -O -m unittest discover -s "$RUNNER_TEMP/issue175/issue175-adblock-ipk-20261126" -p 'test_*.py'
      - name: Verify app review through GNU tar
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/issue175-review"
          COPYFILE_DISABLE=1 tar --format=ustar --no-xattrs --no-acls --no-selinux -cf "$RUNNER_TEMP/issue175-review/evidence.tar" -C evidence issue175-app-review-20261126 issue175-adblock-ipk-20261126 issue172-luci-source-inventory-20261125
          tar -xf "$RUNNER_TEMP/issue175-review/evidence.tar" -C "$RUNNER_TEMP/issue175-review"
          cd /
          python3 -B "$RUNNER_TEMP/issue175-review/issue175-app-review-20261126/verify.py"
          python3 -B -m unittest discover -s "$RUNNER_TEMP/issue175-review/issue175-app-review-20261126" -p 'test_*.py'
