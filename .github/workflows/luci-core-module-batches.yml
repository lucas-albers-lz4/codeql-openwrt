name: LuCI core module package inventory contract
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/luci-core-module-batches.yml'
      - 'tools/luci-core-module-batches/**'
      - 'tools/luci-base-inventory/archive.py'
      - 'tools/luci-base-inventory/compare.py'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check offline parser, package oracle, resolver and controls
        run: |
          python3 -B -m unittest discover -s tools/luci-core-module-batches -p 'test_*.py' -v
          python3 -O -B -m unittest discover -s tools/luci-core-module-batches -p 'test_*.py' -v
          python3 -B -m unittest discover -s tools/luci-base-inventory -p 'test_*.py' -v
          for script in tools/luci-core-module-batches/{run,run-root,locate-paths}.sh; do bash -n "$script"; done

  experiment:
    if: github.event_name == 'workflow_dispatch'
    needs: offline-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install OpenWrt host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget time
      - name: Build three LuCI core packages serially
        run: tools/luci-core-module-batches/run.sh "$RUNNER_TEMP/issue173-core-module-batches"
      - name: Retain package evidence and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue173-core-module-batches-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue173-core-module-batches/output/
          if-no-files-found: warn
          retention-days: 14
