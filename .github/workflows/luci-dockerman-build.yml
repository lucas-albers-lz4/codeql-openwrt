name: Dockerman normal package build candidate
on:
  pull_request:
    paths:
      - 'tools/luci-dockerman-build/**'
      - 'tools/luci-app-metadata-probe/**'
      - 'tools/luci-app-module-batches/kernel-evidence.py'
      - 'tools/luci-statistics-batch/kernel.py'
      - 'tools/luci-statistics-batch/graph_scope.py'
      - 'tools/luci-statistics-batch/run.py'
      - 'tools/luci-base-inventory/**'
      - '.github/workflows/luci-dockerman-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Dockerman offline contract
        run: |
          python3 -I -B -m unittest discover -s tools/luci-dockerman-build -p 'test_*.py' -v
          python3 -I -O -B -m unittest discover -s tools/luci-dockerman-build -p 'test_*.py' -v
          python3 -I -B tools/luci-dockerman-build/run.py --help
          python3 -I -B tools/luci-dockerman-build/compare.py --help
          python3 -I -B tools/luci-dockerman-build/package.py --help
          python3 -I -B -m unittest discover -s tools/luci-app-module-batches -p 'test_*.py' -v
          python3 -I -O -B -m unittest discover -s tools/luci-app-module-batches -p 'test_*.py' -v
          python3 -I -B -m unittest discover -s tools/luci-app-metadata-probe -p 'test_*.py' -v
          python3 -I -O -B -m unittest discover -s tools/luci-app-metadata-probe -p 'test_*.py' -v
          python3 -I -B -m unittest discover -s tools/luci-statistics-batch -p 'test_*.py' -v
          python3 -I -O -B -m unittest discover -s tools/luci-statistics-batch -p 'test_*.py' -v
          python3 -I -B -m unittest discover -s tools/luci-base-inventory -p 'test_*.py' -v
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install OpenWrt build prerequisites
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/dockerman-prereq"
          /usr/bin/time -v -o "$RUNNER_TEMP/dockerman-prereq/apt-update.time" sudo apt-get update 2>&1 | tee "$RUNNER_TEMP/dockerman-prereq/apt-update.log"
          /usr/bin/time -v -o "$RUNNER_TEMP/dockerman-prereq/apt-install.time" sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget time 2>&1 | tee "$RUNNER_TEMP/dockerman-prereq/apt-install.log"
      - name: Build Dockerman with normal dependencies
        env:
          CONSUMER_SHA: ${{ github.sha }}
        run: >-
          python3 -I -B tools/luci-dockerman-build/run.py
          --root "$RUNNER_TEMP/issue173-dockerman-build"
          --consumer-commit "$CONSUMER_SHA"
          --prereq-root "$RUNNER_TEMP/dockerman-prereq"
      - name: Package safely inventoried evidence
        id: bundle
        if: always()
        run: >-
          python3 -I -B tools/luci-dockerman-build/package.py
          --output-root "$RUNNER_TEMP/issue173-dockerman-build/output"
          --archive "$RUNNER_TEMP/issue173-dockerman-evidence.tar"
      - name: Retain build evidence
        if: always() && steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue173-dockerman-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue173-dockerman-evidence.tar
          if-no-files-found: error
          retention-days: 14
