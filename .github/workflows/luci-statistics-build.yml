name: Statistics package candidate build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline guards
        run: |
          python3 -I -B -m unittest discover -s tools/luci-statistics-batch -p 'test_*.py' -v
          python3 -I -O -B -m unittest discover -s tools/luci-statistics-batch -p 'test_*.py' -v
          python3 -I -B tools/luci-statistics-batch/run.py --help
          python3 -I -B tools/luci-statistics-batch/package.py --help
      - name: Install established OpenWrt host prerequisites
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/issue173-statistics-prereq"
          /usr/bin/time -v -o "$RUNNER_TEMP/issue173-statistics-prereq/apt-update.time" sudo apt-get update 2>&1 | tee "$RUNNER_TEMP/issue173-statistics-prereq/apt-update.log"
          /usr/bin/time -v -o "$RUNNER_TEMP/issue173-statistics-prereq/apt-install.time" sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget time 2>&1 | tee "$RUNNER_TEMP/issue173-statistics-prereq/apt-install.log"
      - name: Build reviewed pinned Statistics package
        env:
          CONSUMER_SHA: ${{ github.sha }}
        run: >-
          python3 -I -B tools/luci-statistics-batch/run.py
          --root "$RUNNER_TEMP/issue173-statistics-build"
          --consumer-commit "$CONSUMER_SHA"
          --prereq-root "$RUNNER_TEMP/issue173-statistics-prereq"
      - name: Package safe retained evidence
        id: bundle
        if: always()
        run: >-
          python3 -I -B tools/luci-statistics-batch/package.py
          --output-root "$RUNNER_TEMP/issue173-statistics-build/output"
          --archive "$RUNNER_TEMP/issue173-statistics-build-evidence.tar"
      - name: Retain validated evidence
        if: always() && steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue173-statistics-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue173-statistics-build-evidence.tar
          if-no-files-found: error
          retention-days: 14
