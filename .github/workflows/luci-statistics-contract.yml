name: Statistics build evidence guards
on:
  pull_request:
    paths:
      - '.github/workflows/luci-statistics-contract.yml'
      - 'tools/luci-statistics-batch/**'
      - 'tools/luci-app-metadata-probe/**'
      - 'tools/luci-app-module-batches/compare.py'
      - 'tools/luci-base-inventory/**'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test guards without build or network
        run: |
          python3 -B -m unittest discover -s tools/luci-statistics-batch -p 'test_*.py' -v
          python3 -O -B -m unittest discover -s tools/luci-statistics-batch -p 'test_*.py' -v
          python3 -I -B tools/luci-statistics-batch/run.py --help
