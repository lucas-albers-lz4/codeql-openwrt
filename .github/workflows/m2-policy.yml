name: M2 policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gcc for C double
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Conformance tests
        run: python3 -m unittest discover -s policy/tests -t . -v
