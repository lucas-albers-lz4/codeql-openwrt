name: M2 policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gcc for C double
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Conformance tests
        run: python3 -m unittest discover -s policy/tests -t . -v
      - name: JavaScript extraction gate offline checks
        run: python3 -m unittest discover -s ql-js -p 'test_*.py' -v

  alloy-canonical-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Experiment scope and ACL coverage checks
        run: python3 -m unittest discover -s scratch/alloy-canonical-baseline -p 'test_*.py' -v
      - name: Experimental Alloy canonical baseline
        run: python3 -B scratch/alloy-canonical-baseline/run_baseline.py

  fnmatch-witness-experiment:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record environment
        run: |
          python3 --version
          gcc --version
          ldd --version
      - name: Run bounded search tests
        run: python3 -m unittest discover -s scratch/fnmatch-witness-experiment -v
      - name: Search and independently verify pinned witness
        working-directory: scratch/fnmatch-witness-experiment
        run: |
          gcc -std=c11 -Wall -Wextra -Werror check.c -o /tmp/fnmatch-check
          gcc -std=c11 -Wall -Wextra -Werror independent_check.c -o /tmp/fnmatch-independent-check
          python3 search.py /tmp/fnmatch-check '{"group":"luci-mod-network-config","verb":"read","scope":"file","ubus_object":null}' '/proc/sys/net/ipv6/conf/*/mtu' '{"group":"luci-mod-network-config","verb":"read","scope":"file","ubus_object":null}' '/proc/sys/net/ipv[46]/conf/*'
          /tmp/fnmatch-independent-check
