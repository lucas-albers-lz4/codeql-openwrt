name: Manual packages-feed v0.7 IPK byte experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/packages-feed-ipk-v07.yml'
      - 'tools/packages-ipk-v07/**'
permissions:
  contents: read
concurrency:
  group: packages-feed-ipk-v07
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check source oracle, archive comparator, and runner syntax
        run: |
          python3 -B -m unittest discover -s tools/packages-ipk-v07 -p 'test_*.py' -v
          python3 -m json.tool tools/packages-ipk-v07/oracle.json >/dev/null
          bash -n tools/packages-ipk-v07/run.sh
  experiment:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install OpenWrt host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl time
      - name: Build and compare the two pinned package IPKs
        run: |
          bash tools/packages-ipk-v07/run.sh "$RUNNER_TEMP/packages-ipk-v07-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain IPKs, selected package-stage members, receipts, and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-ipk-v07-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packages-ipk-v07-${{ github.run_id }}-${{ github.run_attempt }}/output/
          if-no-files-found: warn
          retention-days: 14
